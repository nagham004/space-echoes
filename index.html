<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تُركت في صمت، خُلِّدت في العلم | Space Echoes</title>
    <!-- Three.js r128 from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Three.js Starfield 3D Celestial Background -->
    <script src="starfield.js"></script>
    <!-- Three.js DRACOLoader & GLTFLoader for 3D Models -->
    <script src="assets/js/DRACOLoader.js"></script>
    <script src="assets/js/GLTFLoader.js"></script>
    <!-- Link CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="space-app">
    <!-- Starfield 3D Celestial Background Canvas (Fixed behind all content) -->
    <canvas id="starfield" aria-hidden="true"></canvas>

    <!-- Skip to main content link for accessibility -->
    <a href="#space-canvas" class="skip-link">الانتقال إلى المحتوى الرئيسي</a>

    <!-- Top navigation bar -->
    <nav class="top-nav" aria-label="الشريط العلوي">
        <button id="btn-back-to-overview" class="back-nav-btn hidden" aria-label="العودة لنظرة الكواكب">← نظرة عامة على الكواكب</button>
        <button id="motion-toggle" class="motion-btn" aria-label="إيقاف حركة الخلفية" title="إيقاف الحركة">
            <span class="motion-icon" aria-hidden="true">⏸</span>
            <span class="motion-text">إيقاف الحركة</span>
        </button>
        <button id="lang-toggle" class="lang-btn" aria-label="تبديل اللغة">English</button>
    </nav>

    <!-- Fullscreen 3D Canvas Space Stage (Fixed in Background) -->
    <div class="fullscreen-space-stage">
        <!-- Floating Astronaut Quote / Caption -->
        <div id="astronaut-caption" class="astronaut-caption moon-theme hidden-caption" aria-live="polite">
            <span id="astronaut-caption-text" class="caption-text">آثار خالدة على تربة فضية</span>
        </div>
        <canvas id="space-canvas" tabindex="0" role="img"
            aria-label="عرض تفاعلي ثلاثي الأبعاد للقمر والمريخ. مرر الفأرة على القمر ليتوهج، انقر على المريخ لتبديل موضعه، أو انقر على الجرم للتكبير والاستكشاف."></canvas>
    </div>

    <!-- Scroll Track Container for Cinematic Scrollytelling -->
    <div class="scroll-track" id="scroll-track">
        <!-- Section 1: Hero Fullscreen Title (Gradually shrinks and fades on scroll) -->
        <section class="hero-title-section" id="hero-title-section">
            <div class="hero-title-content" id="hero-title-content">
                <h1 id="main-title">تُركت في صمت، خُلِّدت في العلم</h1>
                <p id="main-desc">اكتشف القصص المجهولة لأبطال ناسا المتروكين على سطح القمر والمريخ.</p>
                <div class="scroll-down-hint">
                    <span class="scroll-text" id="scroll-prompt">انزل للأسفل للاستكشاف</span>
                    <span class="scroll-arrow" aria-hidden="true">↓</span>
                </div>
            </div>
        </section>

        <!-- Section 2: Interactive Planets Stage Area -->
        <section class="planets-view-section" id="planets-view-section">
            <!-- Full unobstructed 3D planetary exploration view -->
        </section>
    </div>

    <!-- Artifact Story Drawer / Modal Dialog -->
    <section id="artifact-drawer" class="artifact-drawer hidden" aria-labelledby="artifact-title" role="dialog" aria-modal="true">
        <div class="artifact-card">
            <button id="btn-close-drawer" class="close-btn" aria-label="إغلاق البطاقة">×</button>

            <!-- Header of Artifact -->
            <div class="artifact-header">
                <span id="artifact-tag" class="artifact-tag">القمر</span>
                <h2 id="artifact-title" class="artifact-title">اسم المركبة</h2>
                <div class="artifact-meta">
                    <span id="artifact-year" class="meta-item">السنة: 1969</span>
                    <span id="artifact-coords" class="meta-item">الإحداثيات: 0.67° N, 23.47° E</span>
                </div>
            </div>

            <!-- Intro summary -->
            <div id="artifact-intro-box" class="artifact-intro-box">
                <p id="artifact-summary">نبذة عن المركبة وقصتها.</p>
                <button id="btn-discover-story" class="primary-btn">اكتشف القصة</button>
            </div>

            <!-- Story chapters container (with aria-live for accessibility) -->
            <div id="chapters-wrapper" class="chapters-wrapper hidden">
                <div class="chapter-progress-bar">
                    <span id="chapter-counter" class="chapter-counter">فصل 1 من 4</span>
                </div>

                <!-- Chapters Container with aria-live="polite" -->
                <div id="chapters-container" class="chapters-container" aria-live="polite">
                    <!-- Chapter dynamic content injected here -->
                </div>

                <!-- Chapter Navigation -->
                <div class="chapter-nav">
                    <button id="btn-prev-chapter" class="nav-step-btn hidden">الفصل السابق</button>
                    <button id="btn-next-chapter" class="nav-step-btn primary-btn">الفصل التالي</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Link JavaScript files (Data first, then main script) -->
    <script src="textures-data.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
